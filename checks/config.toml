# This repository's settings over reader-ergonomics' own, merged table by table; a value here wins
# (reader-ergonomics extending.md, the interface). Only the values that change are written.
extends = "reader-ergonomics"

[judgment_quotes]
# Every answer quotes its file, path questions included: this repository's answers already do, and a path answer
# with no quote is how answers turned into templates on 2026-10-29 (decisions/0002).
optional = []

[readable_measure]
# The site loads reader-ergonomics' own site.css at build time (pages.yml); it is measured in that repository, and
# this one has no stylesheet of its own.
stylesheets = []

[sufficient_contrast]
stylesheets = []   # as above

[shape_conformance]
# The standard's general decision record, plus the Options this repository's shape adds (decisions/0003).
shapes = [
  { name = "decision record", files = ["decisions/0*.md"], required = ["Context", "Decision", "Options", "Consequences", "See also"] },
  # An architecture description, where a repository keeps one (principle: order a description by the reader's questions).
  { name = "architecture description", files = ["ARCHITECTURE.md", "docs/architecture.md"], required = ["Purpose and context", "Parts", "Invariants", "Runtime", "Deployment", "Decisions"] },
]

[decision_records]
ask_costs = true   # every record here labels its Consequences Good, Bad and To keep it true (shapes/decision-record.md)

[bibliography_keys]
# A key names one work across the family (reader-ergonomics decision 0003); CI clones each name beside this repository.
family = ["reader-ergonomics", "reader-ergonomics-academic", "reader-ergonomics-learning",
          "reader-ergonomics-presentations", "reader-ergonomics-topic"]
shared_links = [
  "https://web.stanford.edu/~ouster/cgi-bin/book.php",   # two editions, one author page: Ousterhout 2021 here, 2018 in reader-ergonomics
]

[standard_card]
facets = ["specification", "decision", "structure"]   # the principle groups, in the order the card shows them

