project:
  type: website
  output-dir: _site
  render:
    - "**/*.qmd"
    - "**/*.md"
    - "!checks/"
  resources:
    - LICENSE
    - LICENSES/
    - "**/*.md"

website:
  title: "Software design"
  description: "How to write the documents that design software before the code, by what research has measured: shapes and rules for specifications, design documents, decision records, architecture descriptions and diagrams, each with its grade of evidence, and checks to run in CI."
  site-url: "https://tewf.github.io/reader-ergonomics-software-design/"
  repo-url: "https://github.com/Tewf/reader-ergonomics-software-design"
  repo-actions: [source, issue]
  page-navigation: true
  navbar:
    left:
      - text: Evidence
        href: evidence/index.qmd
      - text: Standard
        href: standard.md
      - text: Principles
        href: principles/index.qmd
      - text: Shapes
        href: shapes/index.qmd
      - text: Examples
        href: examples/index.qmd
      - text: Reader styles
        href: reader-styles/index.qmd
      - text: Decisions
        href: decisions/index.qmd
      - text: Bibliography
        href: evidence/bibliography.md
    right:
      - text: The standard
        href: https://tewf.github.io/reader-ergonomics/
  sidebar:
    style: docked
    search: true
    contents: auto

# The stylesheet is reader-ergonomics' own, checked out into _standard/ at build time
# (pages.yml), so the house style lives in one place; Quarto skips folders named with "_".
format:
  html:
    from: markdown-smart
    shift-heading-level-by: -1
    html-math-method: mathml
    toc: true
    toc-depth: 2
    theme:
      light: cosmo
      dark: darkly
    css: _standard/site.css
    link-external-newwindow: false
